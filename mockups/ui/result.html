<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit Crew - Job done</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  .scrim{background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(29,31,43,.72),rgba(29,31,43,.35) 70%)}
  .string{position:fixed;left:50%;top:0;width:4px;height:120px;margin-left:-2px;background:var(--ink);box-shadow:0 0 0 2px rgba(250,243,227,.25)}
  /* the result is a work tag that drops in on its string and swings to rest */
  .result{position:fixed;left:50%;top:92px;width:548px;margin-left:-274px;padding:66px 34px 30px;--r:-1.5deg;transform-origin:50% 0;
    animation:tagdrop .7s var(--ease-thud) both,swing 4s 1s ease-in-out infinite}
  @keyframes tagdrop{from{transform:translateY(-760px) rotate(8deg)}}
  .head{display:flex;align-items:center;gap:12px}
  .head .disc{width:52px;height:52px;border-radius:50%;background:#6E9BEA;border:var(--edge);display:grid;place-items:center;--ic:var(--paper);--ic-a:var(--paper)}
  .head .disc .ico{width:32px;height:32px}
  .head h2{margin:0;font-size:28px;line-height:1;font-weight:700}
  .head small{display:block;font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
  .head .done{margin-left:auto;width:48px;height:48px;border-radius:50%;background:var(--live);border:var(--edge);display:grid;place-items:center;--ink-c:#fff}
  .head .done .ico{width:30px;height:30px}

  .stampzone{position:relative;z-index:2;height:236px;display:grid;place-items:center;margin:6px 0 4px}
  .rays{position:absolute;width:330px;height:330px;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,197,61,.38) 0 9deg,transparent 9deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 18s linear infinite}
  .stamp{--size:190px;transform:rotate(-12deg);animation:stamp .55s 1.5s var(--ease-thud) both}
  .stamp span{font-size:124px}
  .newbest{position:absolute;left:calc(50% + 62px);top:6px;width:70px;height:70px;animation:starpop .5s 1.9s var(--ease-pop) both}
  .newbest .ico{width:70px;height:70px;filter:drop-shadow(0 4px 0 var(--ink))}

  .rows{position:relative;display:grid;gap:10px}
  .row{position:relative;display:grid;grid-template-columns:52px 1fr 60px;align-items:center;gap:14px;padding:8px 10px 8px 12px;border-radius:18px;background:var(--paper-2);animation:rise .35s var(--ease-pop) both}
  .row:nth-child(1){animation-delay:.6s}.row:nth-child(2){animation-delay:.85s}.row:nth-child(3){animation-delay:1.1s}
  .row .ico{width:44px;height:44px}
  .row b{font-size:34px;font-weight:600;line-height:1}
  .row .medal{--size:54px}
  .row.best{z-index:2;background:var(--hat);box-shadow:inset 0 0 0 3px var(--ink);--ic-a:var(--paper)}
  .row.best .medal{box-shadow:inset 0 0 0 4px var(--gold-rim),inset 0 0 0 6px rgba(38,42,64,.9),0 4px 0 var(--ink),0 0 0 5px var(--paper)}
  /* best-of-three: the winning row's cable runs up into the big stamp */
  .feed{z-index:1;position:absolute;right:-60px;top:-230px;width:120px;height:290px;overflow:visible;pointer-events:none}

  .actions2{display:flex;gap:14px;margin-top:26px}
  .actions2 .btn{height:84px;border-radius:22px;box-shadow:0 7px 0 var(--ink)}
  .actions2 .sq{width:84px;padding:0}
  .actions2 .sq .ico{width:40px;height:40px}
  .actions2 .next{flex:1;justify-content:space-between;padding:0 12px 0 26px;font-size:28px}
  .actions2 .next .ico{width:40px;height:40px}
  .actions2 .next .nx{display:flex;align-items:center;gap:6px;height:60px;padding:0 12px 0 6px;border-radius:16px;background:var(--paper);border:var(--edge);font-size:17px;font-weight:600;position:relative;z-index:1}
  .actions2 .next .d{width:44px;height:44px;border-radius:50%;background:#FF8A3D;border:var(--edge);display:grid;place-items:center;--ic:var(--paper);--ic-a:var(--paper)}
  .actions2 .next .d .ico{width:26px;height:26px}
  .actions2 .key{position:absolute;right:-7px;top:-9px}

  .confetti i{position:fixed;width:12px;height:20px;border:2.5px solid var(--ink);border-radius:3px;animation:fall 2.4s ease-in both}
  @keyframes fall{from{transform:translateY(-300px) rotate(0)}}
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="scene">
  <div class="plate">
    <img src="bg/meeting-complete.png" alt="">
    <i class="patch" style="left:18px;top:18px;width:245px;height:106px"></i>
    <i class="patch" style="left:1176px;top:18px;width:250px;height:78px"></i>
  </div>
</div>
<div class="scrim"></div>

<div class="confetti" aria-hidden="true">
  <i style="left:300px;top:180px;background:#FFC53D;transform:rotate(20deg)"></i>
  <i style="left:382px;top:420px;background:#5ED6CC;transform:rotate(-35deg)"></i>
  <i style="left:250px;top:640px;background:#E5484D;transform:rotate(60deg)"></i>
  <i style="left:420px;top:760px;background:#FFC53D;transform:rotate(-12deg)"></i>
  <i style="left:1100px;top:210px;background:#E5484D;transform:rotate(-25deg)"></i>
  <i style="left:1040px;top:470px;background:#FFC53D;transform:rotate(40deg)"></i>
  <i style="left:1180px;top:640px;background:#5ED6CC;transform:rotate(10deg)"></i>
  <i style="left:1010px;top:790px;background:#3BB273;transform:rotate(-55deg)"></i>
  <i style="left:1250px;top:360px;background:#3BB273;transform:rotate(75deg)"></i>
  <i style="left:180px;top:320px;background:#6E9BEA;transform:rotate(-70deg)"></i>
</div>

<i class="string"></i>
<section class="result tag" aria-label="Job done, grade A">
  <i class="eyelet"></i><i class="hole"></i>
  <div class="head">
    <span class="disc"><svg class="ico"><use href="#i-projector"/></svg></span>
    <div><small>01</small><h2>Big Meeting</h2></div>
    <span class="done"><svg class="ico"><use href="#i-check"/></svg></span>
  </div>

  <div class="stampzone">
    <i class="rays"></i>
    <span class="medal stamp"><span>A</span></span>
    <span class="newbest"><svg class="ico"><use href="#i-star"/></svg></span>
  </div>

  <div class="rows">
    <div class="row best"><svg class="ico"><use href="#i-clock"/></svg><b>1:48</b><span class="medal"><span>A</span></span></div>
    <div class="row"><svg class="ico"><use href="#i-mug"/></svg><b>23</b><span class="medal c"><span>C</span></span></div>
    <div class="row"><svg class="ico"><use href="#i-coins"/></svg><b>410</b><span class="medal b"><span>B</span></span></div>
    <svg class="feed" viewBox="0 0 120 290" aria-hidden="true">
      <path d="M20 265 C 92 262, 104 200, 92 160 S 30 96, -84 108" fill="none" stroke="#262A40" stroke-width="14" stroke-linecap="round"/>
      <path d="M20 265 C 92 262, 104 200, 92 160 S 30 96, -84 108" fill="none" stroke="#FFC53D" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 12"/>
    </svg>
  </div>

  <div class="actions2">
    <button class="btn sq" aria-label="Retry"><svg class="ico"><use href="#i-retry"/></svg><span class="key">R</span></button>
    <button class="btn sq" aria-label="Jobs"><svg class="ico"><use href="#i-jobs"/></svg></button>
    <button class="btn primary next" aria-label="Next job: Lunch Rush"><svg class="ico"><use href="#i-next"/></svg><span class="nx"><span class="d"><svg class="ico"><use href="#i-tray"/></svg></span>02</span></button>
  </div>
</section>
</body>
</html>
