<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUD - Phone portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
  /* Phone portrait: same components, scaled down one step; thumbs own the bottom 40%. */
  .hud{--safe-t:max(14px,env(safe-area-inset-top));--safe-b:max(18px,env(safe-area-inset-bottom))}
  .jobplate{left:12px;top:var(--safe-t);padding:5px 10px 5px 5px;gap:2px}
  .badge{width:62px;height:62px}
  .badge .disc{width:46px;height:46px}.badge .disc .ico{width:28px;height:28px}
  .tally{width:46px}.tally .ico{width:25px;height:25px}.tally b{font-size:15px}
  .topright{right:12px;top:var(--safe-t)}
  .pausebtn{width:52px;height:52px;border-radius:16px}.pausebtn .ico{width:24px;height:24px}
  .strain{position:absolute;right:12px;top:calc(var(--safe-t) + 74px);padding:5px 12px 5px 5px;gap:8px}
  .reel{width:40px;height:40px}.reel .ico{width:26px;height:26px}
  .cablebar{width:104px;height:20px}
  /* virtual stick */
  .stick{left:22px;bottom:calc(var(--safe-b) + 18px);width:140px;height:140px;border-radius:50%;
    background:rgba(250,243,227,.22);border:3px solid rgba(250,243,227,.75);box-shadow:0 0 0 3px rgba(38,42,64,.55),inset 0 0 0 3px rgba(38,42,64,.35);backdrop-filter:blur(2px)}
  .stick::before{content:"";position:absolute;inset:28px;border-radius:50%;border:2px dashed rgba(250,243,227,.55)}
  .knob{position:absolute;left:52px;top:26px;width:64px;height:64px;border-radius:50%;background:var(--hat);border:var(--edge);box-shadow:0 5px 0 var(--ink)}
  .knob::after{content:"";position:absolute;inset:10px 14px 26px 10px;border-radius:50%;background:rgba(255,255,255,.35)}
  /* action diamond: grab is the thumb's home, the rest fan around it */
  .pad{right:14px;bottom:var(--safe-b);width:210px;height:220px}
  .pad .act{position:absolute;pointer-events:auto}
  .pad .act .ico{width:36px;height:36px}
  .pad .grab{right:0;bottom:22px;width:92px;height:92px;border-radius:50%}
  .pad .grab .ico{width:50px;height:50px}
  .pad .cable{right:104px;bottom:6px;width:70px;height:70px;border-radius:50%}
  .pad .throw{right:112px;bottom:92px;width:70px;height:70px;border-radius:50%}
  .pad .jump{right:12px;bottom:128px;width:70px;height:70px;border-radius:50%}
  .pad .cam{right:150px;bottom:174px;width:52px;height:52px;border-radius:50%}.pad .cam .ico{width:28px;height:28px}
  .pad .act.on{transform:translateY(-6px)}
  .pad .act.ready::before{border-radius:50%}
  /* off-screen target pointer: sits on the screen edge, arrow points at the socket */
  .pointer{right:6px;top:392px;display:flex;align-items:center}
  .pointer .dot{width:54px;height:54px;border-radius:50%;background:var(--snap);border:var(--edge);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);animation:breathe 1.1s ease-in-out infinite;--ic:var(--paper);--ic-a:var(--paper)}
  .pointer .dot .ico{width:32px;height:32px}
  .pointer .tip{width:0;height:0;border:12px solid transparent;border-left:16px solid var(--ink);margin-left:-2px}
</style>
</head>
<body>
<script src="icons.js"></script>

<!-- Close-up camera shot, cropped around Pip for portrait. -->
<div class="scene">
  <div class="plate" style="--z:1.2;--tx:-700px;--ty:-96px">
    <img src="bg/shot-meeting.png" alt="">
  </div>
</div>
<svg class="overlay" viewBox="0 0 390 844">
  <path class="route" d="M170 510 C 230 560, 300 470, 372 418"/>
</svg>

<div class="hud">
  <div class="jobplate card">
    <div class="badge">
      <svg class="ring" viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="36" stroke-width="8"/><circle class="left" cx="42" cy="42" r="36" stroke-width="8" stroke-dasharray="150 227"/></svg>
      <div class="disc"><svg class="ico"><use href="#i-projector"/></svg></div>
    </div>
    <div class="tallies">
      <div class="tally"><svg class="ico"><use href="#i-clock"/></svg><b>1:24</b></div>
      <div class="tally"><svg class="ico"><use href="#i-mug"/></svg><b>3</b></div>
      <div class="tally"><svg class="ico"><use href="#i-coins"/></svg><b>120</b></div>
    </div>
  </div>
  <div class="topright"><button class="btn pausebtn" aria-label="Pause"><svg class="ico"><use href="#i-pause"/></svg></button></div>
  <div class="strain card">
    <div class="reel" style="--left:.55"><svg class="ico"><use href="#i-reel"/></svg></div>
    <div class="cablebar" style="--t:.5;"><i style="background:linear-gradient(90deg,#fff 0 48px,#FFD45C 48px 70px,var(--warm) 70px 88px,var(--trip) 88px)"></i></div>
  </div>

  <div class="pointer"><div class="dot"><svg class="ico"><use href="#i-projector"/></svg></div><i class="tip"></i></div>

  <div class="stick"><i class="knob"></i></div>
  <div class="pad">
    <div class="act cam"><svg class="ico"><use href="#i-camera"/></svg></div>
    <div class="act jump"><svg class="ico"><use href="#i-jump"/></svg></div>
    <div class="act throw off"><svg class="ico"><use href="#i-throw"/></svg></div>
    <div class="act cable on"><svg class="ico"><use href="#i-plug"/></svg></div>
    <div class="act grab"><svg class="ico"><use href="#i-hand"/></svg></div>
  </div>
</div>
</body>
</html>
